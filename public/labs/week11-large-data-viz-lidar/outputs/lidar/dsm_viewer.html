<!doctype html><html><head><meta charset="utf-8"><title>Philadelphia DSM tiles</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{margin:0;font:15px system-ui}#map{height:85vh;background:#e9eef2}header{padding:12px}
.legend{background:white;padding:10px;max-width:240px;line-height:1.5}</style></head><body>
<header><b>Philadelphia DSM — three classified LAS examples</b><br>Colored surface elevation (m, NAVD88); transparent areas have no data.</header>
<div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>const map=L.map('map').fitBounds([[39.839103990512406, -75.32245722492095], [39.85388729250392, -75.30456178734066]]);
L.tileLayer('tiles/dsm/{z}/{x}/{y}.png',{minZoom:15,maxZoom:19,maxNativeZoom:17,
 attribution:'LiDAR: City of Philadelphia / PASDA; DSM processing: MUSA 5500'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
const legend=L.control({position:'bottomright'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');
d.innerHTML='DSM display scale: 0.3 m to 0.6 m<br>terrain color ramp; 2–98% clipping<br>XYZ tiles, z15–17; NoData transparent<br>Analytical heights: <a href="philadelphia_dsm_mosaic.tif">GeoTIFF</a>';return d;};legend.addTo(map);
</script></body></html>
