# Dependency reference for the existing course geospatial environment.
# Follow the notebooks to install additional packages without creating a new environment.
name: geospatial
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python-duckdb=1.5.6
  - pandas=2.2
  - matplotlib
  - pyarrow
  - shapely
  - geopandas
  - requests
  - jupyterlab
  - ipykernel
  - nbclient
  - nbconvert
  - fastapi
  - uvicorn
  - httpx
